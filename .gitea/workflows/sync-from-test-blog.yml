name: Sync from test-blog
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or tag from invader/test-blog to sync"
        required: false
        default: "master"

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout blog
        uses: https://git.yolo.fail/actions/checkout@v4
        with:
          path: blog

      - name: Resolve source ref
        id: source
        env:
          INPUT_SOURCE_REF: ${{ github.event.inputs.source_ref }}
        run: |
          if [ -n "$INPUT_SOURCE_REF" ]; then
            echo "ref=$INPUT_SOURCE_REF" >> "$GITHUB_OUTPUT"
          else
            DEFAULT_BRANCH=$(git ls-remote --symref ${{ github.server_url }}/invader/test-blog.git HEAD | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2; exit}')
            echo "ref=${DEFAULT_BRANCH:-master}" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone test-blog (public HTTPS clone)
        env:
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        run: |
          git clone --depth 1 --branch "$SOURCE_REF" ${{ github.server_url }}/invader/test-blog.git test-blog

      - name: Sync template files from test-blog
        run: |
          # Gitea workflows (.gitea) and the GitHub copies (.github); keep this workflow file in blog.
          for dir in .gitea/workflows .github/workflows; do
            mkdir -p "blog/$dir"
            rsync -av --delete \
              --exclude 'sync-from-test-blog.yml' \
              --exclude 'sync-to-blog.yml' \
              "test-blog/$dir/" "blog/$dir/"
          done

          # Hugo theme starter assets and static template files.
          rsync -av --delete test-blog/assets/ blog/assets/
          rsync -av --delete test-blog/static/ blog/static/

          rsync -av --delete test-blog/layouts/ blog/layouts/

          cp test-blog/go.mod blog/go.mod
          cp test-blog/go.sum blog/go.sum

          # nginx image build files
          cp test-blog/Dockerfile blog/Dockerfile
          cp test-blog/nginx.conf blog/nginx.conf
          cp test-blog/.dockerignore blog/.dockerignore

          # Sync template config files but keep site-specific config.toml in blog.
          rsync -av --delete \
            --exclude 'config.toml' \
            test-blog/config/_default/ blog/config/_default/

      - name: Safety check (content must not change)
        run: |
          if git -C blog diff --name-only | grep -q '^content/'; then
            echo "Error: content/ changes detected. Aborting sync to protect blog posts."
            git -C blog diff --name-only | grep '^content/' || true
            exit 1
          fi

      - name: Detect synced changes
        id: changes
        run: |
          if [ -n "$(git -C blog status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit synced changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git -C blog config user.name "gitea-actions[bot]"
          git -C blog config user.email "gitea-actions[bot]@git.yolo.fail"
          git -C blog switch -c sync/template-changes
          git -C blog add -A
          git -C blog commit -m "sync: apply template changes from test-blog"

      - name: Create pull request in blog
        id: create_pr
        if: steps.changes.outputs.has_changes == 'true'
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        run: |
          git -C blog push --force origin sync/template-changes

          BODY=$(cat <<MD
          Manual sync of template changes from [invader/test-blog](${{ github.server_url }}/invader/test-blog).

          Source ref: \`$SOURCE_REF\`

          Synced paths:
          - \`.gitea/workflows/\` and \`.github/workflows/\` (excluding sync workflows)
          - \`assets/\`
          - \`static/\`
          - \`layouts/\`
          - \`go.mod\` and \`go.sum\`
          - \`Dockerfile\`, \`nginx.conf\` and \`.dockerignore\`
          - \`config/_default/\` (excluding \`config.toml\`)

          Not synced:
          - \`content/\` (blog posts/pages remain blog-specific)
          - \`config/_default/config.toml\` (site identity and URL stay blog-specific)
          MD
          )

          # Gitea returns 409 when an open PR already exists for this branch; the force-push above updated it
          STATUS=$(jq -n --arg base "$BASE" --arg body "$BODY" \
              '{head: "sync/template-changes", base: $base, title: "Sync template changes from test-blog", body: $body}' |
            curl -sS -o /dev/null -w '%{http_code}' -X POST "${{ github.api_url }}/repos/${{ github.repository }}/pulls" \
              -H "Authorization: token $TOKEN" -H "Content-Type: application/json" -d @-)
          echo "Create PR returned HTTP $STATUS"
          [ "$STATUS" = 201 ] || [ "$STATUS" = 409 ]

      - name: Fallback direct push
        if: steps.changes.outputs.has_changes == 'true' && steps.create_pr.outcome == 'failure'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: git -C blog push origin HEAD:"$TARGET_BRANCH"

      - name: No changes to sync
        if: steps.changes.outputs.has_changes == 'false'
        run: echo "No template changes detected between test-blog and blog."
